// ─── BATTERIJ BOUWEN ──────────────────────────────────────────────────────────
function maakBatterij(fase) {
  const kleuren=['#FF3B30','#FF9500','#FFCC00','#A8E063','#34C759'];
  let streepjes='';
  for(let i=1;i<=5;i++) streepjes+=i<=fase?`<div class="batterij-streep" style="background:${kleuren[i-1]};height:6px;border-radius:2px;"></div>`:'<div class="batterij-streep" style="background:#E8EAF0;height:6px;border-radius:2px;"></div>';
  return `<div class="batterij-wrap"><div class="batterij-top"></div><div class="batterij-body">${streepjes}</div><div class="fase-nummer">Fase ${fase}</div></div>`;
}

// ─── BOUW NAVIGATIE & SECTIES ─────────────────────────────────────────────────
const domeinContainer=document.getElementById('domein-container');
const navKnoppen=document.getElementById('nav-knoppen');

domeinen.forEach((domein,di)=>{
  const navKnop=document.createElement('button');
  navKnop.className='nav-domein'+(di===0?' actief':'');
  navKnop.textContent=domein.naam;
  navKnop.onclick=()=>{
    document.querySelectorAll('.nav-domein').forEach(k=>k.classList.remove('actief'));
    navKnop.classList.add('actief');
    document.querySelectorAll('.domein-sectie').forEach(s=>s.classList.remove('actief'));
    document.getElementById('domein-'+domein.id).classList.add('actief');
    sluitDetail();
  };
  navKnoppen.appendChild(navKnop);

  const sectie=document.createElement('div');
  sectie.className='domein-sectie'+(di===0?' actief':'');
  sectie.id='domein-'+domein.id;
  const doelList=doelen.filter(d=>d.domein===domein.id);
  sectie.innerHTML=`<div class="domein-header"><h2>${domein.naam}</h2><p>${doelList.length} leerdoel${doelList.length>1?'en':''} — klik op een kaart om de leerlijn te bekijken</p></div><div class="kaarten-grid" id="grid-${domein.id}"></div>`;
  domeinContainer.appendChild(sectie);

  const grid=sectie.querySelector('.kaarten-grid');
  doelList.forEach(doel=>{
    const kaart=document.createElement('div');
    kaart.className=`doel-kaart ${doel.klasse}`;
    kaart.id='kaart-'+doel.id;
    let icoonHtml;
    if(doel.svg) icoonHtml=`<div class="doel-icoon-svg">${doel.svg}</div>`;
    else if(doel.ms) icoonHtml=`<span class="ms-icon" style="background:${doel.ms}">${doel.icoonTekst}</span>`;
    else if(doel.isHalf) icoonHtml=`<span class="doel-icoon" style="font-size:20px;font-weight:800;color:#1B5E20;">½</span>`;
    else icoonHtml=`<span class="doel-icoon">${doel.icoon}</span>`;
    kaart.innerHTML=`${icoonHtml}<div class="doel-tekst"><div class="cat">${klasseNamen[doel.klasse]||doel.klasse}</div><div class="naam">${doel.naam}</div></div>`;
    kaart.onclick=()=>openDetail(doel);
    grid.appendChild(kaart);
  });
});

// ─── DETAIL PANEL ─────────────────────────────────────────────────────────────
let huidigDoel=null;
let rubricCache={};

async function openDetail(doel){
  huidigDoel=doel;
  document.querySelectorAll('.doel-kaart').forEach(k=>k.classList.remove('actief-kaart'));
  document.getElementById('kaart-'+doel.id).classList.add('actief-kaart');
  document.getElementById('detail-titel').textContent=doel.naam;
  document.getElementById('detail-meta').textContent=doel.domein.toUpperCase();
  document.getElementById('opslaan-bev').style.display='none';
  document.getElementById('status-msg').textContent='⏳ Laden...';
  try{
    const snap=await getDoc(doc(db,'leerlijnen',doel.id));
    rubricCache[doel.id]=snap.exists()?snap.data().rubric:null;
  }catch(e){rubricCache[doel.id]=null;}
  document.getElementById('status-msg').textContent='';
  bouwTabs(doel);
  document.getElementById('leerlijn-detail').style.display='block';
  document.getElementById('leerlijn-detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function bouwTabs(doel){
  const tabsBalk=document.getElementById('doel-tabs');
  const panelContainer=document.getElementById('doel-panels');
  tabsBalk.innerHTML=''; panelContainer.innerHTML='';

  doel.tabs.forEach((tab,ti)=>{
    const tabKnop=document.createElement('button');
    tabKnop.className='doel-tab'+(ti===0?' actief':'');
    tabKnop.textContent=tab.titel;
    tabKnop.onclick=()=>{
      tabsBalk.querySelectorAll('.doel-tab').forEach(t=>t.classList.remove('actief'));
      panelContainer.querySelectorAll('.doel-panel').forEach(p=>p.classList.remove('actief'));
      tabKnop.classList.add('actief');
      document.getElementById(`panel-${doel.id}-${ti}`).classList.add('actief');
    };
    tabsBalk.appendChild(tabKnop);

    const panel=document.createElement('div');
    panel.className='doel-panel'+(ti===0?' actief':'');
    panel.id=`panel-${doel.id}-${ti}`;

    let html=`<div class="rubric-wrap"><table class="rubric-tabel"><thead><tr><th style="min-width:110px;max-width:130px;text-align:left;background:#f8f8f8;">Categorie</th>`;
    for(let f=1;f<=5;f++) html+=`<th class="fase-header-cel">${maakBatterij(f)}</th>`;
    html+=`</tr></thead><tbody id="tbody-${doel.id}-${ti}"></tbody></table></div>`;
    html+=`<button class="voeg-rij-knop" onclick="voegRijToe('${doel.id}',${ti})">+ Rij toevoegen</button>`;
    panel.innerHTML=html;
    panelContainer.appendChild(panel);

    const opgeslagenRijen=rubricCache[doel.id]?.[ti]||null;
    const bronRijen=opgeslagenRijen?Object.values(opgeslagenRijen):tab.rijen;
    const tbody=document.getElementById(`tbody-${doel.id}-${ti}`);

    // Vaste 'beschrijving voor de leerling' rij bovenaan
    const beschrijvingRij = document.createElement('tr');
    beschrijvingRij.className = 'beschrijving-rij';
    beschrijvingRij.id = `beschrijving-${doel.id}-${ti}`;
    const opgeslagenBeschr = rubricCache[doel.id]?.[`beschrijving_${ti}`] || ['','','','',''];
    let beschrHtml = `<td><textarea class="cat-cel" style="color:#1a3a8a;font-weight:700;" readonly>Beschrijving voor de leerling</textarea></td>`;
    for(let fi=0;fi<5;fi++) beschrHtml += `<td style="background:#EEF4FF;"><textarea class="rubric-cel" id="beschr-${doel.id}-${ti}-${fi}" placeholder="Beschrijving fase ${fi+1}...">${opgeslagenBeschr[fi]||''}</textarea></td>`;
    beschrijvingRij.innerHTML = beschrHtml;
    tbody.appendChild(beschrijvingRij);

    bronRijen.forEach((rij,ri)=>vulRij(tbody,doel.id,ti,ri,rij));
  });
}

function vulRij(tbody,doelId,ti,ri,rij){
  const tr=document.createElement('tr');
  tr.id=`rij-${doelId}-${ti}-${ri}`;
  let html=`<td style="min-width:110px;max-width:130px;background:#f8f8f8;"><button class="verwijder-rij" onclick="verwijderRij('${doelId}',${ti},${ri})" title="Verwijder rij">✕</button><textarea class="cat-cel" id="cat-${doelId}-${ti}-${ri}" placeholder="Categorie...">${rij.cat||''}</textarea></td>`;
  for(let fi=0;fi<5;fi++) html+=`<td><textarea class="rubric-cel" id="cel-${doelId}-${ti}-${ri}-${fi}" placeholder="Fase ${fi+1}...">${rij.f?.[fi]||''}</textarea></td>`;
  tr.innerHTML=html;
  tbody.appendChild(tr);
}

window.voegRijToe=function(doelId,ti){
  const tbody=document.getElementById(`tbody-${doelId}-${ti}`);
  const ri=tbody.querySelectorAll('tr').length;
  vulRij(tbody,doelId,ti,ri,{cat:'',f:['','','','','']});
};

window.verwijderRij=function(doelId,ti,ri){
  const rij=document.getElementById(`rij-${doelId}-${ti}-${ri}`);
  if(rij) rij.remove();
};

window.sluitDetail=function(){
  document.getElementById('leerlijn-detail').style.display='none';
  document.querySelectorAll('.doel-kaart').forEach(k=>k.classList.remove('actief-kaart'));
  huidigDoel=null;
};

window.slaanOp=async function(){
  if(!huidigDoel)return;
  const rubric={};
  huidigDoel.tabs.forEach((tab,ti)=>{
    rubric[ti]={};
    const tbody=document.getElementById(`tbody-${huidigDoel.id}-${ti}`);
    if(!tbody)return;
    tbody.querySelectorAll('tr:not(.beschrijving-rij)').forEach((rij,ri)=>{
      const cat=document.getElementById(`cat-${huidigDoel.id}-${ti}-${ri}`)?.value||'';
      const f=[];
      for(let fi=0;fi<5;fi++) f.push(document.getElementById(`cel-${huidigDoel.id}-${ti}-${ri}-${fi}`)?.value||'');
      rubric[ti][ri]={cat,f};
    });
    // Beschrijving rij opslaan
    const beschr=[];
    for(let fi=0;fi<5;fi++) beschr.push(document.getElementById(`beschr-${huidigDoel.id}-${ti}-${fi}`)?.value||'');
    rubric[`beschrijving_${ti}`]=beschr;
  });
  document.getElementById('status-msg').textContent='⏳ Opslaan...';
  try{
    await setDoc(doc(db,'leerlijnen',huidigDoel.id),{rubric});
    rubricCache[huidigDoel.id]=rubric;
    document.getElementById('status-msg').textContent='';
    document.getElementById('opslaan-bev').style.display='inline';
    setTimeout(()=>document.getElementById('opslaan-bev').style.display='none',3000);
  }catch(e){document.getElementById('status-msg').textContent='⚠️ Opslaan mislukt.';}
};

// Auto-resize textareas
document.addEventListener('input', e => {
  if (e.target.classList.contains('rubric-cel') || e.target.classList.contains('cat-cel')) {
    e.target.style.height = 'auto';
    e.target.style.height = e.target.scrollHeight + 'px';
  }
});
