<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKAN – Leerkracht</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #F0F2F5; color: #1a1a1a; padding: 24px 16px 48px; }

#login-scherm { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
.login-kaart { background: white; border-radius: 16px; padding: 40px 36px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); max-width: 360px; width: 100%; text-align: center; }
.login-kaart h1 { font-size: 20px; margin-bottom: 6px; }
.login-kaart p { font-size: 13px; color: #666; margin-bottom: 24px; }
.login-kaart input { width: 100%; border: 1.5px solid #ddd; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px; }
.login-kaart input:focus { border-color: #4A90D9; }
.login-knop { width: 100%; background: #2B579A; color: white; border: none; border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
.login-knop:hover { background: #1E3F70; }
.login-fout { color: #e55; font-size: 13px; margin-top: 8px; display: none; }

#hoofd { display: none; }
header { max-width: 1100px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
header h1 { font-size: 20px; font-weight: 700; }
.uitloggen { font-size: 12px; background: none; border: 1px solid #ccc; border-radius: 6px; padding: 5px 10px; cursor: pointer; color: #666; }

.filters { max-width: 1100px; margin: 0 auto 20px; background: white; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); flex-wrap: wrap; }
.filters label { font-size: 13px; font-weight: 600; color: #444; white-space: nowrap; }
.filters select { border: 1.5px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-family: inherit; outline: none; background: #fafafa; cursor: pointer; min-width: 150px; }

.status { max-width: 1100px; margin: 0 auto 10px; font-size: 12px; color: #888; min-height: 18px; }
#overzicht { max-width: 1100px; margin: 0 auto; }
.geen-data { text-align: center; color: #999; font-size: 14px; margin-top: 40px; }

/* SAMENVATTING */
.samenvatting { max-width: 1100px; margin: 0 auto 20px; background: white; border-radius: 12px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: none; }
.samenvatting h2 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.stat-rij { display: flex; gap: 12px; flex-wrap: wrap; }
.stat-blok { text-align: center; background: #F0F2F5; border-radius: 8px; padding: 10px 16px; flex: 1; min-width: 100px; }
.stat-getal { font-size: 22px; font-weight: 700; color: #2B579A; }
.stat-label { font-size: 11px; color: #888; margin-top: 2px; }

/* KLAS CONTAINER MET LEERLING TABBLADEN */
.klas-container { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px; }
.klas-titel { padding: 14px 20px; background: #2B579A; color: white; font-size: 15px; font-weight: 700; }

/* LEERLING TABBLADEN */
.leerling-tabs-balk { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 16px; border-bottom: 1px solid #eee; background: #f8f9fa; }
.leerling-tab-knop { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; background: #E8EAF0; color: #555; border: none; font-family: inherit; transition: all 0.15s; }
.leerling-tab-knop:hover { background: #d0d4e0; }
.leerling-tab-knop.actief { background: #2B579A; color: white; }

/* LEERLING DETAIL */
.leerling-detail { display: none; padding: 20px; }
.leerling-detail.actief { display: block; }
.leerling-header-detail { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
.leerling-naam { font-size: 16px; font-weight: 700; }
.leerling-meta { font-size: 12px; color: #888; }
.klas-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: #E8EAF0; color: #444; margin-left: 8px; }
.acties-rij { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.verwijder-knop { font-size: 12px; color: #e55; background: none; border: 1px solid #e55; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.reset-pin-knop { font-size: 12px; color: #888; background: none; border: 1px solid #ddd; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.reset-pin-knop:hover { background: #f5f5f5; }

/* INHOUD TABS */
.inhoud-tabs { display: flex; gap: 0; border-bottom: 1px solid #eee; margin-bottom: 16px; }
.inhoud-tab { padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; color: #888; border-bottom: 3px solid transparent; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; transition: all 0.15s; }
.inhoud-tab:hover { color: #333; }
.inhoud-tab.actief { color: #2B579A; border-bottom-color: #2B579A; }
.inhoud-panel { display: none; }
.inhoud-panel.actief { display: block; }

/* TOP 3 FEEDBACK */
.top3-vak { background: #E6F1FB; border: 1.5px solid #85B7EB; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.top3-vak h4 { font-size: 13px; font-weight: 700; color: #0C447C; margin-bottom: 10px; }
.top3-rij { display: flex; gap: 10px; flex-wrap: wrap; }
.top3-invoer { flex: 1; min-width: 180px; }
.top3-invoer label { font-size: 11px; font-weight: 700; color: #0C447C; display: block; margin-bottom: 3px; }
.top3-invoer textarea { width: 100%; border: 1.5px solid #85B7EB; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 48px; outline: none; background: white; }
.top3-invoer textarea:focus { border-color: #2B579A; }

/* LEERDOELEN */
.sectie-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin: 14px 0 6px; }
.sectie-label.cultuur { color:#3C3489; } .sectie-label.tijdruimte { color:#085041; }
.sectie-label.digitaal { color:#0C447C; } .sectie-label.techniek { color:#633806; }
.sectie-label.leer { color:#27500A; } .sectie-label.gods { color:#72243E; }

.leerdoel-rij { margin-bottom: 10px; }
.leerdoel-rij-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.leerdoel-naam { font-size: 12px; color: #555; flex: 1; min-width: 200px; }
.mini-balk { display: flex; gap: 3px; width: 100px; flex-shrink: 0; }
.mini-stap { flex: 1; height: 12px; border-radius: 3px; background: #E8EAF0; }
.mini-fase-select { font-family: inherit; font-size: 11px; border: 1.5px solid #ddd; border-radius: 6px; padding: 3px 6px; background: #fafafa; cursor: pointer; outline: none; }
.mini-fase-select:focus { border-color: #4A90D9; }

/* HISTORIEK */
.historiek-rij { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; margin-left: 12px; }
.historiek-item { font-size: 10px; background: #f0f0f0; border-radius: 4px; padding: 2px 6px; color: #666; }
.historiek-item .pijl { color: #2BAF84; font-weight: 700; }

.cultuur-kleur { background:#7C6FD4; } .tijdruimte-kleur { background:#2BAF84; }
.digitaal-kleur { background:#3A82D0; } .techniek-kleur { background:#D4850A; }
.leer-kleur { background:#6BAA2A; } .gods-kleur { background:#C4527A; }

/* FEEDBACK */
.feedback-invoer { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 180px; }
.feedback-invoer textarea { flex: 1; font-family: inherit; font-size: 12px; border: 1.5px solid #ddd; border-radius: 8px; padding: 5px 8px; resize: vertical; min-height: 32px; outline: none; background: #FFFBEA; }
.feedback-invoer textarea:focus { border-color: #F5C400; }

.leerling-acties-onder { display: flex; justify-content: flex-start; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.feedback-opslaan-knop { background: #F5C400; color: #333; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
.feedback-opslaan-knop:hover { background: #d4a900; }
.opslaan-bev { font-size: 12px; color: #2BAF84; font-weight: 600; display: none; }

/* TOEKOMST */
.toekomst-sectie { margin-bottom: 20px; }
.toekomst-sectie h4 { font-size: 13px; font-weight: 700; color: #555; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
.toekomst-veld { display: flex; gap: 8px; margin-bottom: 8px; }
.toekomst-sleutel { font-size: 12px; font-weight: 600; color: #888; min-width: 180px; flex-shrink: 0; }
.toekomst-waarde { font-size: 12px; color: #333; }
.talent-rij { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.talent-naam-lk { font-size: 12px; color: #555; min-width: 160px; }
.talent-mini-balk { display: flex; gap: 3px; }
.talent-mini-stap { width: 18px; height: 12px; border-radius: 3px; background: #E8EAF0; }
.talent-mini-stap.actief { background: #7C6FD4; }
.tijdlijn-mini { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.tijdlijn-item { background: #f0f0f0; border-radius: 6px; padding: 4px 10px; font-size: 12px; }
.tijdlijn-item strong { display: block; font-size: 11px; color: #888; }
.icon-grid-lk { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.icon-item-lk { font-size: 11px; background: #f0f0f0; border-radius: 6px; padding: 3px 8px; }
</style>
</head>
<body>

<div id="login-scherm">
  <div class="login-kaart">
    <h1>🎓 Leerkrachtenpagina</h1>
    <p>Voer het wachtwoord in om verder te gaan.</p>
    <input type="password" id="wachtwoord-input" placeholder="Wachtwoord…" onkeydown="if(event.key==='Enter') controleerWachtwoord()">
    <button class="login-knop" onclick="controleerWachtwoord()">Inloggen</button>
    <p class="login-fout" id="login-fout">Ongeldig wachtwoord.</p>
  </div>
</div>

<div id="hoofd">
  <header>
    <div><h1>🎓 Leerkrachtenoverzicht – OKAN</h1><p style="font-size:13px;color:#666;">Voortgang · Toekomst · Feedback per leerling</p></div>
    <button class="uitloggen" onclick="uitloggen()">↩ Uitloggen</button>
  </header>

  <div class="filters">
    <label>Klas:</label>
    <select id="klas-filter" onchange="laadKlas()">
      <option value="">— Kies een klas —</option>
      <option value="wit">Wit</option><option value="zwart">Zwart</option><option value="roze">Roze</option>
      <option value="oranje">Oranje</option><option value="paars">Paars</option><option value="mint">Mint</option>
      <option value="rood">Rood</option><option value="blauw">Blauw</option><option value="geel">Geel</option>
      <option value="groen">Groen</option><option value="goud">Goud</option><option value="zilver">Zilver</option>
    </select>
  </div>

  <div class="samenvatting" id="samenvatting">
    <h2 id="samenvatting-titel">Klasoverzicht</h2>
    <div class="stat-rij" id="stat-rij"></div>
  </div>

  <div class="status" id="status"></div>
  <div id="overzicht"><p class="geen-data">Kies een klas om te beginnen.</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc, updateDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8o-_FR2mvEciuxDgkfY__XRF_VtAZwUM",
  authDomain: "okan-leerdoelen.firebaseapp.com",
  projectId: "okan-leerdoelen",
  storageBucket: "okan-leerdoelen.firebasestorage.app",
  messagingSenderId: "767763105714",
  appId: "1:767763105714:web:4a79429a484b22a30d06ab"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const WACHTWOORD = "okan2025";

window.controleerWachtwoord = function() {
  if (document.getElementById('wachtwoord-input').value === WACHTWOORD) {
    document.getElementById('login-scherm').style.display='none';
    document.getElementById('hoofd').style.display='block';
    sessionStorage.setItem('okan_auth','1');
  } else { document.getElementById('login-fout').style.display='block'; }
};
window.uitloggen = function() {
  sessionStorage.removeItem('okan_auth');
  document.getElementById('login-scherm').style.display='flex';
  document.getElementById('hoofd').style.display='none';
  document.getElementById('wachtwoord-input').value='';
};
if (sessionStorage.getItem('okan_auth')==='1') {
  document.getElementById('login-scherm').style.display='none';
  document.getElementById('hoofd').style.display='block';
}

const FASE_LABELS = ["Nog niet begonnen","Fase 1","Fase 2","Fase 3","Fase 4","Fase 5"];

const leerdoelen = [
  {icoon:"🫀",  vaardigheid:"Cultuur",                             doel:"Ik leef gezond en netjes.",                                          klasse:"cultuur"},
  {icoon:"🗣️", vaardigheid:"Cultuur",                             doel:"Ik geef mijn mening.",                                               klasse:"cultuur"},
  {icoon:"🎨",  vaardigheid:"Cultuur",                             doel:"Ik maak een creatief product.",                                       klasse:"cultuur"},
  {icoon:"🇧🇪",vaardigheid:"Cultuur",                             doel:"Ik gedraag me gepast in de Belgische samenleving.",                   klasse:"cultuur"},
  {icoon:"🏙️", vaardigheid:"Cultuur",                             doel:"Ik gebruik de diensten in mijn stad.",                                klasse:"cultuur"},
  {icoon:"🕰️🌍",vaardigheid:"Tijd en ruimte",                     doel:"Ik leg uit hoe mensen leven in verschillende tijden en plaatsen.",    klasse:"tijdruimte"},
  {icoon:"🪜🧭",vaardigheid:"Tijd en ruimte",                      doel:"Ik leg uit waar ik ben en waar ik naartoe wil.",                      klasse:"tijdruimte"},
  {icoon:"💻",  vaardigheid:"Digitale vaardigheden",               doel:"Ik bedien een computer.",                                             klasse:"digitaal"},
  {icoon:"📱",  vaardigheid:"Digitale vaardigheden",               doel:"Ik gebruik digitale en online mediatools.",                           klasse:"digitaal"},
  {icoon:"W",   vaardigheid:"Digitale vaardigheden",               doel:"Ik werk met het programma Word.",                                     klasse:"digitaal"},
  {icoon:"X",   vaardigheid:"Digitale vaardigheden",               doel:"Ik werk met het programma Excel.",                                    klasse:"digitaal"},
  {icoon:"P",   vaardigheid:"Digitale vaardigheden",               doel:"Ik werk met het programma Powerpoint.",                               klasse:"digitaal"},
  {icoon:"📐",  vaardigheid:"Techniek en praktische vaardigheden", doel:"Ik meet met een meetinstrument.",                                     klasse:"techniek"},
  {icoon:"⛑️", vaardigheid:"Techniek en praktische vaardigheden", doel:"Ik werk veilig volgens de regels.",                                   klasse:"techniek"},
  {icoon:"📋",  vaardigheid:"Techniek en praktische vaardigheden", doel:"Ik werk het product goed af met een stappenplan.",                    klasse:"techniek"},
  {icoon:"🔵",  vaardigheid:"Leerstrategie",                       doel:"Ik vat de informatie samen.",                                         klasse:"leer"},
  {icoon:"🧠",  vaardigheid:"Leerstrategie",                       doel:"Ik memoriseer de inhoud van de les.",                                 klasse:"leer"},
  {icoon:"🔤",  vaardigheid:"Leerstrategie (ALFA)",                doel:"Ik memoriseer de woorden uit de les.",                                klasse:"leer"},
  {icoon:"📄",  vaardigheid:"Leerstrategie",                       doel:"Ik herken de structuur van een tekst.",                               klasse:"leer"},
  {icoon:"💡",  vaardigheid:"Leerstrategie",                       doel:"Ik pas de leerstof toe om problemen op te lossen.",                   klasse:"leer"},
  {icoon:"🙏",  vaardigheid:"Godsdienst",                          doel:"Ik zeg wat ik belangrijk vind.",                                      klasse:"gods"},
  {icoon:"⛪",  vaardigheid:"Godsdienst",                          doel:"Ik herken de verschillende godsdiensten.",                            klasse:"gods"},
  {icoon:"❤️", vaardigheid:"Godsdienst",                          doel:"Ik toon respect voor iedereen in een gesprek.",                       klasse:"gods"},
];

const secties = [
  {label:"Cultuur",klasse:"cultuur"},{label:"Tijd en ruimte",klasse:"tijdruimte"},
  {label:"Digitale vaardigheden",klasse:"digitaal"},{label:"Techniek en praktische vaardigheden",klasse:"techniek"},
  {label:"Leerstrategie",klasse:"leer"},{label:"Godsdienst",klasse:"gods"},
];

const talenten = [
  {id:"zelfstandig",naam:"Zelfstandig"},{id:"initiatief",naam:"Initiatief nemen"},{id:"doorzetting",naam:"Doorzettingsvermogen"},
  {id:"planmatig",naam:"Planmatig"},{id:"flexibel",naam:"Flexibel"},{id:"technisch",naam:"Technisch inzicht"},
  {id:"veilig",naam:"Veilig"},{id:"zorgzaam",naam:"Zorgzaam"},{id:"sociaal",naam:"Sociaal"},
  {id:"leiderschap",naam:"Leiderschap"},{id:"digitaal",naam:"Digitaal inzicht"},{id:"handig",naam:"Handig"},
  {id:"actief",naam:"Actief"},{id:"ruimtelijk",naam:"Ruimtelijk inzicht"},{id:"wiskundig",naam:"Wiskundig"},
  {id:"communicatief",naam:"Communicatief"},{id:"leergierig",naam:"Leergierig"},{id:"talig",naam:"Talig"},
  {id:"creatief",naam:"Creatief"},{id:"nauwkeurig",naam:"Nauwkeurig"},{id:"probleemoplossend",naam:"Probleemoplossend"},
  {id:"kritisch",naam:"Kritisch"},{id:"zelfkennis",naam:"Zelfkennis"},
];

let huidigeLeerlingen = [];
let huidigeKlas = '';
function setStatus(msg) { document.getElementById('status').textContent=msg; }

window.laadKlas = async function() {
  const klas = document.getElementById('klas-filter').value;
  huidigeKlas = klas;
  document.getElementById('samenvatting').style.display='none';
  document.getElementById('overzicht').innerHTML='<p class="geen-data">Laden…</p>';
  huidigeLeerlingen=[];
  if (!klas) { document.getElementById('overzicht').innerHTML='<p class="geen-data">Kies een klas.</p>'; return; }
  setStatus('⏳ Laden…');
  try {
    const snap = await getDocs(collection(db,'klassen',klas,'leerlingen'));
    for (const d of snap.docs) {
      const ldata = d.data();
      const tSnap = await getDoc(doc(db,'klassen',klas,'toekomst',d.id));
      ldata.toekomst = tSnap.exists() ? tSnap.data() : null;
      huidigeLeerlingen.push({...ldata, _id:d.id});
    }
    setStatus('');
  } catch(e) { setStatus('⚠️ Laadprobleem.'); return; }
  if (huidigeLeerlingen.length===0) { document.getElementById('overzicht').innerHTML='<p class="geen-data">Nog geen leerlingen in deze klas.</p>'; return; }
  toonSamenvatting(klas, huidigeLeerlingen);
  toonKlasMetTabbladen(klas, huidigeLeerlingen);
};

function toonSamenvatting(klas, leerlingen) {
  const s=document.getElementById('samenvatting');
  document.getElementById('samenvatting-titel').textContent=`Klas ${klas.charAt(0).toUpperCase()+klas.slice(1)} — ${leerlingen.length} leerling(en)`;
  const totalen={},aantallen={};
  secties.forEach(s=>{totalen[s.klasse]=0;aantallen[s.klasse]=0;});
  leerlingen.forEach(l=>leerdoelen.forEach(item=>{totalen[item.klasse]+=(l.leerdoelen?.[item.doel]||0);aantallen[item.klasse]++;}));
  document.getElementById('stat-rij').innerHTML=secties.map(sec=>{
    const gem=aantallen[sec.klasse]>0?(totalen[sec.klasse]/aantallen[sec.klasse]).toFixed(1):'–';
    return `<div class="stat-blok"><div class="stat-getal">${gem}</div><div class="stat-label">${sec.label}</div></div>`;
  }).join('');
  s.style.display='block';
}

function toonKlasMetTabbladen(klas, leerlingen) {
  const overzicht = document.getElementById('overzicht');
  overzicht.innerHTML = '';
  const container = document.createElement('div');
  container.className = 'klas-container';
  container.innerHTML = `<div class="klas-titel">Klas ${klas.charAt(0).toUpperCase()+klas.slice(1)}</div>
    <div class="leerling-tabs-balk" id="leerling-tabs-balk"></div>`;
  overzicht.appendChild(container);

  const tabsBalk = container.querySelector('#leerling-tabs-balk');

  leerlingen.forEach((data, index) => {
    // Tab knop
    const tabKnop = document.createElement('button');
    tabKnop.className = 'leerling-tab-knop' + (index===0?' actief':'');
    tabKnop.textContent = data.naam;
    tabKnop.onclick = () => {
      container.querySelectorAll('.leerling-tab-knop').forEach(t=>t.classList.remove('actief'));
      container.querySelectorAll('.leerling-detail').forEach(d=>d.classList.remove('actief'));
      tabKnop.classList.add('actief');
      document.getElementById(`detail_${klas}_${index}`).classList.add('actief');
    };
    tabsBalk.appendChild(tabKnop);

    // Detail panel
    const detail = document.createElement('div');
    detail.className = 'leerling-detail' + (index===0?' actief':'');
    detail.id = `detail_${klas}_${index}`;
    const lid = `L_${klas}_${index}`;

    let html = `<div class="leerling-header-detail">
      <div><span class="leerling-naam">${data.naam}</span><span class="klas-badge">${data.klas}</span>
      ${data.pincode?'<span style="font-size:11px;color:#2BAF84;margin-left:8px;">🔒 Pincode ingesteld</span>':'<span style="font-size:11px;color:#aaa;margin-left:8px;">Geen pincode</span>'}
      </div>
      <div class="acties-rij">
        <span class="leerling-meta">Opgeslagen: ${data.tijdstip||'–'}</span>
        <button class="reset-pin-knop" onclick="resetPin('${klas}','${data.naam}')">🔑 Reset pincode</button>
        <button class="verwijder-knop" onclick="verwijder('${klas}','${data.naam}',${index})">✕ Verwijder</button>
      </div>
    </div>`;

    // INHOUD TABS
    html += `<div class="inhoud-tabs">
      <button class="inhoud-tab actief" onclick="inhoudTab('${lid}','leerdoelen',this)">📊 Leerdoelen</button>
      <button class="inhoud-tab" onclick="inhoudTab('${lid}','toekomst',this)">🌟 Mijn toekomst</button>
    </div>`;

    // PANEL LEERDOELEN
    html += `<div class="inhoud-panel actief" id="${lid}-leerdoelen">`;

    // TOP 3 FEEDBACK
    const t1 = data.top3?.[0]||''; const t2 = data.top3?.[1]||''; const t3 = data.top3?.[2]||'';
    html += `<div class="top3-vak">
      <h4>🏆 Top 3 belangrijkste feedback voor ${data.naam}</h4>
      <div class="top3-rij">
        <div class="top3-invoer"><label>1.</label><textarea id="top3_1_${lid}" placeholder="Belangrijkste feedback…">${t1}</textarea></div>
        <div class="top3-invoer"><label>2.</label><textarea id="top3_2_${lid}" placeholder="Tweede feedback…">${t2}</textarea></div>
        <div class="top3-invoer"><label>3.</label><textarea id="top3_3_${lid}" placeholder="Derde feedback…">${t3}</textarea></div>
      </div>
    </div>`;

    // LEERDOELEN MET HISTORIEK
    secties.forEach(sectie => {
      const items = leerdoelen.filter(l=>l.klasse===sectie.klasse);
      html += `<div class="sectie-label ${sectie.klasse}">${sectie.label}</div>`;
      items.forEach(item => {
        const fase = data.leerdoelen?.[item.doel]||0;
        const historiek = data.historiek?.[item.doel]||[];
        const bestaandeFeedback = data.feedback?.[item.doel]||'';
        const balkHTML = [1,2,3,4,5].map(i=>`<div class="mini-stap ${i<=fase?sectie.klasse+'-kleur':''}"></div>`).join('');
        const faseSelectId = `fs_${lid}_${item.doel.replace(/[^a-zA-Z0-9]/g,'_')}`;
        const fbId = `fb_${lid}_${item.doel.replace(/[^a-zA-Z0-9]/g,'_')}`;
        const faseOpties = FASE_LABELS.map((l,i)=>`<option value="${i}"${i===fase?' selected':''}>${l}</option>`).join('');
        const historiekHTML = historiek.length>0
          ? historiek.map(h=>`<span class="historiek-item">${h.datum}: <span class="pijl">→</span> ${FASE_LABELS[h.fase]||'fase '+h.fase}</span>`).join('')
          : '';
        html += `<div class="leerdoel-rij">
          <div class="leerdoel-rij-top">
            <span class="leerdoel-naam">${item.icoon} ${item.doel}</span>
            <div class="mini-balk">${balkHTML}</div>
            <select class="mini-fase-select" id="${faseSelectId}" onchange="updateMiniBalk(this,'${sectie.klasse}','${faseSelectId}')">${faseOpties}</select>
            <div class="feedback-invoer"><textarea id="${fbId}" placeholder="Feedback…" rows="1">${bestaandeFeedback}</textarea></div>
          </div>
          ${historiekHTML?`<div class="historiek-rij">${historiekHTML}</div>`:''}
        </div>`;
      });
    });

    html += `<div class="leerling-acties-onder">
      <button class="feedback-opslaan-knop" id="knop_${lid}" onclick="slaLeerdoelenOp('${klas}','${data.naam}','${lid}')">💾 Opslaan</button>
      <span class="opslaan-bev" id="bev_${lid}">✅ Opgeslagen!</span>
    </div></div>`;

    // PANEL TOEKOMST
    html += `<div class="inhoud-panel" id="${lid}-toekomst">`;
    const t = data.toekomst;
    if (!t) { html += `<p style="color:#aaa;font-size:13px;padding:10px 0;">Nog niets ingevuld bij 'Mijn toekomst'.</p>`; }
    else {
      if (t.tijdlijn) {
        html += `<div class="toekomst-sectie"><h4>🗓️ Tijdlijn</h4><div class="tijdlijn-mini">`;
        [['alfa','Alfa'],['instroom','Instroom'],['uitstroom','Uitstroom'],['snuffel','Snuffelstage'],['nieuw','Start nieuwe school']].forEach(([k,label])=>{
          if(t.tijdlijn[k]) html+=`<div class="tijdlijn-item"><strong>${label}</strong>${t.tijdlijn[k]}</div>`;
        });
        html += `</div></div>`;
      }
      if (t.wiebenik) {
        html += `<div class="toekomst-sectie"><h4>👤 Wie ben ik?</h4>`;
        [['naam','Naam'],['leeftijd','Leeftijd'],['hobbys',"Hobby's"],['vaklabel','Favoriete vakken'],['persoon','Belangrijk persoon'],['plek','Favoriete plaats']].forEach(([k,label])=>{
          if(t.wiebenik[k]) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">${label}</span><span class="toekomst-waarde">${t.wiebenik[k]}</span></div>`;
        });
        if (t.wiebenik.vaklabels) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Favoriete vakken</span><span class="toekomst-waarde">${t.wiebenik.vaklabels}</span></div>`;
        html += `</div>`;
      }
      if (t.dromen) {
        html += `<div class="toekomst-sectie"><h4>🌟 Mijn dromen</h4>`;
        [['kinderjob','Droomjob als kind'],['nujob','Droomjob nu']].forEach(([k,label])=>{
          if(t.dromen[k]) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">${label}</span><span class="toekomst-waarde">${t.dromen[k]}</span></div>`;
        });
        if (t.dromen.interesses) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Interesses</span><span class="toekomst-waarde">${t.dromen.interesses}</span></div>`;
        html += `</div>`;
      }
      if (t.hoeleerik) {
        const leerwijzeLabels={doen:'Al doende leren',boek:'Uit boeken leren',beide:'Beide'};
        const studieLabels={graag:'Graag studeren',mindergraag:'Minder graag studeren'};
        const hulpItems=['rust','muziek','herhalen','uitleggen','plaatjes','pauzes'].filter(k=>t.hoeleerik['help_'+k]).join(', ');
        html+=`<div class="toekomst-sectie"><h4>📖 Hoe leer ik?</h4>`;
        if(t.hoeleerik.leerwijze) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Zo leer ik</span><span class="toekomst-waarde">${leerwijzeLabels[t.hoeleerik.leerwijze]||t.hoeleerik.leerwijze}</span></div>`;
        if(t.hoeleerik.studiehouding) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Studiehouding</span><span class="toekomst-waarde">${studieLabels[t.hoeleerik.studiehouding]||t.hoeleerik.studiehouding}</span></div>`;
        if(hulpItems) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Wat helpt</span><span class="toekomst-waarde">${hulpItems}</span></div>`;
        if(t.hoeleerik.extra) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Extra</span><span class="toekomst-waarde">${t.hoeleerik.extra}</span></div>`;
        html+=`</div>`;
      }
      if (t.talenten) {
        html+=`<div class="toekomst-sectie"><h4>💪 Talenten</h4>`;
        talenten.forEach(tal=>{
          const val=t.talenten[tal.id]||0;
          if(val>0){
            const kleur = ['#FF3B30','#FF6B35','#FF9500','#FFCC00','#34C759'];
            const balkHTML=[1,2,3,4,5].map(i=>`<div class="talent-mini-stap${i<=val?' actief':''}" style="${i<=val?'background:'+kleur[i-1]:''}""></div>`).join('');
            html+=`<div class="talent-rij"><span class="talent-naam-lk">${tal.naam}</span><div class="talent-mini-balk">${balkHTML}</div><span style="font-size:11px;color:#aaa;margin-left:4px;">${val}/5</span></div>`;
          }
        });
        html+=`</div>`;
      }
    }
    html += `</div>`; // inhoud-panel toekomst

    detail.innerHTML = html;
    container.appendChild(detail);
  });
}

window.inhoudTab = function(lid, panel, el) {
  const kaart = el.closest('.leerling-detail');
  kaart.querySelectorAll('.inhoud-tab').forEach(t=>t.classList.remove('actief'));
  kaart.querySelectorAll('.inhoud-panel').forEach(p=>p.classList.remove('actief'));
  el.classList.add('actief');
  document.getElementById(`${lid}-${panel}`).classList.add('actief');
};

window.updateMiniBalk = function(select, klasse, id) {
  const val=parseInt(select.value);
  const rij=select.closest('.leerdoel-rij-top');
  const stappen=rij.querySelectorAll('.mini-stap');
  stappen.forEach((s,i)=>{ s.className=`mini-stap${i<val?' '+klasse+'-kleur':''}`; });
};

window.slaLeerdoelenOp = async function(klas, naam, lid) {
  const knop=document.getElementById(`knop_${lid}`);
  const bev=document.getElementById(`bev_${lid}`);
  knop.disabled=true;
  const nieuweLeerdoelen={}, feedback={}, top3=[];
  const nu = new Date().toLocaleDateString('nl-BE');

  // Huidige data ophalen voor historiek
  const ref = doc(db,'klassen',klas,'leerlingen',naam);
  const snap = await getDoc(ref);
  const bestaand = snap.exists() ? snap.data() : {};
  const oudeLeerdoelen = bestaand.leerdoelen || {};
  const oudeHistoriek = bestaand.historiek || {};

  leerdoelen.forEach(item=>{
    const faseId=`fs_${lid}_${item.doel.replace(/[^a-zA-Z0-9]/g,'_')}`;
    const fbId=`fb_${lid}_${item.doel.replace(/[^a-zA-Z0-9]/g,'_')}`;
    const faseEl=document.getElementById(faseId);
    const fbEl=document.getElementById(fbId);
    const nieuweFase = faseEl ? parseInt(faseEl.value) : 0;
    const oudeFase = oudeLeerdoelen[item.doel] || 0;
    nieuweLeerdoelen[item.doel] = nieuweFase;
    if(fbEl) feedback[item.doel]=fbEl.value.trim();

    // Historiek bijhouden
    const hist = oudeHistoriek[item.doel] || [];
    if (nieuweFase !== oudeFase && nieuweFase > 0) {
      hist.push({ datum: nu, fase: nieuweFase });
    }
    oudeHistoriek[item.doel] = hist;
  });

  // Top 3
  for(let i=1;i<=3;i++){
    const el=document.getElementById(`top3_${i}_${lid}`);
    top3.push(el?el.value.trim():'');
  }

  try {
    await setDoc(ref,{...bestaand, leerdoelen:nieuweLeerdoelen, feedback, historiek:oudeHistoriek, top3, tijdstip:new Date().toLocaleString('nl-BE')});
    // Update lokale data
    const l=huidigeLeerlingen.find(l=>l.naam===naam);
    if(l){l.leerdoelen=nieuweLeerdoelen;l.feedback=feedback;l.historiek=oudeHistoriek;l.top3=top3;}
    bev.style.display='inline'; setTimeout(()=>bev.style.display='none',3000);
  } catch(e){alert('Opslaan mislukt.');}
  knop.disabled=false;
};

window.resetPin = async function(klas, naam) {
  if(!confirm(`Pincode van ${naam} resetten? De leerling kan daarna een nieuwe pincode instellen.`)) return;
  try {
    const ref = doc(db,'klassen',klas,'leerlingen',naam);
    const snap = await getDoc(ref);
    const bestaand = snap.exists() ? snap.data() : {};
    // Bewaar alle data behalve pincode
    await setDoc(ref, {...bestaand, pincode: null});
    alert(`Pincode van ${naam} is gereset. De leerling kan nu een nieuwe pincode kiezen.`);
    laadKlas();
  } catch(e){alert('Reset mislukt.');}
};

window.verwijder = async function(klas, naam, index) {
  if(!confirm(`Verwijder alle data van ${naam}?`)) return;
  try {
    await deleteDoc(doc(db,'klassen',klas,'leerlingen',naam));
    await deleteDoc(doc(db,'klassen',klas,'toekomst',naam));
    huidigeLeerlingen=huidigeLeerlingen.filter(l=>l.naam!==naam);
    laadKlas();
  } catch(e){alert('Verwijderen mislukt.');}
};
</script>
