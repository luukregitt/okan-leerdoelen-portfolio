<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getallenspel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #2f4a3e;
    --board-dark: #23392f;
    --wood: #7a4a2b;
    --wood-dark: #5c3620;
    --chalk-white: #f4f1e8;
    --chalk-yellow: #f2d675;
    --chalk-pink: #ef9fc0;
    --chalk-blue: #8fcbe0;
    --chalk-orange: #f0a868;
    --chalk-green: #a8d98f;
    --danger: #d9534f;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    height:100%;
    font-family: 'Quicksand', sans-serif;
    background: var(--wood-dark);
    overflow: hidden;
  }

  #frame{
    position: relative;
    width: 100%;
    height: 100vh;
    padding: 22px;
    background:
      repeating-linear-gradient(90deg, var(--wood) 0px, var(--wood) 28px, var(--wood-dark) 28px, var(--wood-dark) 30px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #board{
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1100px;
    max-height: 720px;
    background: var(--board);
    border-radius: 14px;
    box-shadow: inset 0 0 0 6px var(--board-dark), inset 0 20px 60px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  /* chalk dust texture */
  #board::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 2px 4px;
    pointer-events:none;
  }

  #redFlash{
    position:absolute;
    inset:0;
    background: var(--danger);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.12s ease;
    z-index: 20;
  }
  #redFlash.on{ opacity: 0.55; }

  #greenFlash{
    position:absolute;
    inset:0;
    background: var(--chalk-green);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.15s ease;
    z-index: 20;
  }
  #greenFlash.on{ opacity: 0.35; }

  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 30px;
    z-index: 5;
  }
  .hidden{ display:none !important; }

  h1.title{
    font-family:'Kalam', cursive;
    color: var(--chalk-white);
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    margin: 0 0 6px 0;
    transform: rotate(-1.5deg);
    text-shadow: 0 0 12px rgba(244,241,232,0.15);
  }
  p.sub{
    font-family:'Kalam', cursive;
    color: var(--chalk-yellow);
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    margin: 0 0 26px 0;
  }

  .chalk-btn{
    font-family:'Kalam', cursive;
    font-size: 1.5rem;
    color: var(--board-dark);
    background: var(--chalk-white);
    border: none;
    border-radius: 60% 40% 55% 45% / 45% 55% 40% 60%;
    padding: 16px 42px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25);
    transition: transform 0.08s ease;
  }
  .chalk-btn:hover{ transform: translateY(-2px); }
  .chalk-btn:active{ transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }

  #hud{
    position:absolute;
    top: 14px;
    left: 0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 22px;
    z-index: 10;
    pointer-events:none;
  }
  #hud > *{ pointer-events:auto; }

  #levelBadge{
    font-family:'Kalam', cursive;
    color: var(--chalk-yellow);
    font-size: 1.3rem;
    background: rgba(0,0,0,0.2);
    border: 2px dashed rgba(244,241,232,0.4);
    border-radius: 16px;
    padding: 6px 18px;
    transform: rotate(-1deg);
  }

  #listenBtn{
    width: 58px; height: 58px;
    border-radius: 50%;
    background: var(--chalk-blue);
    border: none;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25);
    font-size: 1.6rem;
  }
  #listenBtn:active{ transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }

  #instruction{
    position:absolute;
    top: 84px;
    left: 0; right: 0;
    text-align:center;
    font-family:'Kalam', cursive;
    color: rgba(244,241,232,0.75);
    font-size: 1.05rem;
    z-index: 10;
    pointer-events:none;
  }

  #playArea{
    position:absolute;
    inset:0;
    z-index: 8;
  }

  .option{
    position:absolute;
    font-family:'Kalam', cursive;
    font-weight: 700;
    cursor: pointer;
    border: 3px dashed rgba(244,241,232,0.75);
    border-radius: 50% / 50%;
    background: transparent;
    color: var(--chalk-white);
    padding: 16px 10px;
    min-width: 92px;
    min-height: 92px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height: 1.1;
    transition: transform 0.08s ease, background 0.15s ease;
    user-select:none;
  }
  .option:hover{ background: rgba(244,241,232,0.08); transform: scale(1.05); }
  .option:active{ transform: scale(0.96); }
  .option.correctFlash{ background: rgba(168,217,143,0.35); border-color: var(--chalk-green); }
  .option.wrongFlash{ background: rgba(217,83,79,0.4); border-color: var(--danger); }

  #startScreen .chalk-emoji{ font-size: 3rem; margin-bottom: 6px; }

  #winScreen h1{ color: var(--chalk-yellow); }

  @media (max-width: 640px){
    .option{ min-width: 74px; min-height: 74px; font-size: 1.15rem; padding: 10px 6px; }
    #listenBtn{ width: 50px; height: 50px; font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div id="frame">
  <div id="board">

    <div id="hud" class="hidden">
      <div id="levelBadge">Level 1 / 8</div>
      <button id="listenBtn" title="Luister opnieuw" aria-label="Luister opnieuw">🔊</button>
    </div>

    <div id="instruction" class="hidden">Luister goed en klik op het juiste getal</div>

    <div id="playArea"></div>

    <div id="redFlash"></div>
    <div id="greenFlash"></div>

    <div id="startScreen" class="screen">
      <div class="chalk-emoji">🔢</div>
      <h1 class="title">Getallenspel</h1>
      <p class="sub">Luister naar het getal en klik op het juiste antwoord</p>
      <button class="chalk-btn" id="startBtn">Start</button>
    </div>

    <div id="loseScreen" class="screen hidden">
      <h1 class="title">Helaas!</h1>
      <p class="sub">Dat was niet het juiste getal. Probeer het nog eens!</p>
      <button class="chalk-btn" id="retryBtn">Opnieuw beginnen</button>
    </div>

    <div id="winScreen" class="screen hidden">
      <div class="chalk-emoji">🏆</div>
      <h1 class="title">Goed gedaan!</h1>
      <p class="sub">Je hebt alle levels gehaald!</p>
      <button class="chalk-btn" id="playAgainBtn">Nog een keer</button>
    </div>

  </div>
</div>

<script>
(function(){
  const WOORDEN = ["nul","een","twee","drie","vier","vijf","zes","zeven","acht","negen","tien",
    "elf","twaalf","dertien","veertien","vijftien","zestien","zeventien","achttien","negentien","twintig"];
  const TOTAL_LEVELS = 8;

  const startScreen = document.getElementById('startScreen');
  const loseScreen = document.getElementById('loseScreen');
  const winScreen = document.getElementById('winScreen');
  const hud = document.getElementById('hud');
  const instruction = document.getElementById('instruction');
  const levelBadge = document.getElementById('levelBadge');
  const playArea = document.getElementById('playArea');
  const listenBtn = document.getElementById('listenBtn');
  const redFlash = document.getElementById('redFlash');
  const greenFlash = document.getElementById('greenFlash');

  let level = 1;
  let currentNumber = 0;
  let locked = false;
  let audioCtx = null;

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, start, dur, type, gain){
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.value = 0;
    osc.connect(g); g.connect(audioCtx.destination);
    const t0 = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain || 0.2, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function playWinSound(){
    try {
      ensureAudio();
      [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> tone(f, i*0.09, 0.22, 'triangle', 0.18));
    } catch(e) { console.warn('Geluid kon niet gestart worden:', e); }
  }

  function playFailSound(){
    try {
      ensureAudio();
      tone(220, 0, 0.35, 'sawtooth', 0.16);
      tone(160, 0.08, 0.4, 'sawtooth', 0.16);
    } catch(e) { console.warn('Geluid kon niet gestart worden:', e); }
  }

  function speakNumber(n){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(WOORDEN[n]);
    utter.lang = 'nl-BE';
    utter.rate = 0.9;
    const voices = window.speechSynthesis.getVoices();
    const nlVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('nl'));
    if(nlVoice) utter.voice = nlVoice;
    window.speechSynthesis.speak(utter);
  }

  function randInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = randInt(0, i);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function pickDistractors(target, count, level){
    const window_ = Math.max(3, 9 - level);
    const pool = [];
    for(let n = 0; n <= 20; n++){
      if(n !== target && Math.abs(n - target) <= window_) pool.push(n);
    }
    shuffle(pool);
    const picked = pool.slice(0, count);
    let n = 0;
    while(picked.length < count && n <= 20){
      if(n !== target && !picked.includes(n)) picked.push(n);
      n++;
    }
    return picked;
  }

  const ZONES = [
    {top: 12, left: 8},
    {top: 18, left: 58},
    {top: 55, left: 4},
    {top: 60, left: 68},
    {top: 38, left: 33}
  ];

  function layoutOptions(numbers, representation){
    playArea.innerHTML = '';
    const zones = shuffle(ZONES.slice());
    numbers.forEach((num, i) => {
      const zone = zones[i];
      const jitterTop = randInt(-4, 4);
      const jitterLeft = randInt(-3, 3);
      const rotate = randInt(-8, 8);
      const btn = document.createElement('div');
      btn.className = 'option';
      btn.style.top = (zone.top + jitterTop) + '%';
      btn.style.left = (zone.left + jitterLeft) + '%';
      btn.style.transform = 'rotate(' + rotate + 'deg)';
      btn.style.fontSize = randInt(24, 34) + 'px';
      btn.textContent = representation === 'word' ? WOORDEN[num] : String(num);
      btn.dataset.value = num;
      btn.addEventListener('click', () => onOptionClick(btn, num));
      playArea.appendChild(btn);
    });
  }

  function startRound(){
    locked = false;
    levelBadge.textContent = 'Level ' + level + ' / ' + TOTAL_LEVELS;
    currentNumber = randInt(0, 20);
    const distractors = pickDistractors(currentNumber, 4, level);
    const options = shuffle([currentNumber, ...distractors]);
    const representation = Math.random() < 0.5 ? 'digit' : 'word';
    layoutOptions(options, representation);
    setTimeout(() => speakNumber(currentNumber), 350);
  }

  function onOptionClick(btn, value){
    if(locked) return;
    locked = true;
    if(value === currentNumber){
      btn.classList.add('correctFlash');
      playWinSound();
      greenFlash.classList.add('on');
      setTimeout(() => greenFlash.classList.remove('on'), 220);
      setTimeout(() => {
        if(level >= TOTAL_LEVELS){
          showScreen(winScreen);
        } else {
          level++;
          startRound();
        }
      }, 650);
    } else {
      btn.classList.add('wrongFlash');
      playFailSound();
      redFlash.classList.add('on');
      setTimeout(() => {
        showScreen(loseScreen);
        redFlash.classList.remove('on');
      }, 500);
    }
  }

  function showScreen(screen){
    [startScreen, loseScreen, winScreen].forEach(s => s.classList.add('hidden'));
    if(screen){
      screen.classList.remove('hidden');
      hud.classList.add('hidden');
      instruction.classList.add('hidden');
      playArea.innerHTML = '';
    } else {
      hud.classList.remove('hidden');
      instruction.classList.remove('hidden');
    }
  }

  function beginSpel(){
    level = 1;
    showScreen(null);
    startRound();
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    try { ensureAudio(); } catch(e) { console.warn('Geluid kon niet gestart worden:', e); }
    beginSpel();
  });

  document.getElementById('retryBtn').addEventListener('click', beginSpel);
  document.getElementById('playAgainBtn').addEventListener('click', beginSpel);

  listenBtn.addEventListener('click', () => {
    try { speakNumber(currentNumber); } catch(e) { console.warn('Spraak kon niet afgespeeld worden:', e); }
  });

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = () => {};
  }
})();
</script>

</body>
</html>
